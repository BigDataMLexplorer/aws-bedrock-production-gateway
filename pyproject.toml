[project]
name = "aws-bedrock-production-gateway"
version = "0.1.0"
description = "Production-minded AWS Bedrock AI gateway with resilient routing, structured outputs, cost controls and observability"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.10",
  "boto3>=1.35",
  "botocore>=1.35",
  "opentelemetry-api>=1.29",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "httpx>=0.28",
  "matplotlib>=3.9",
  "playwright>=1.50",
]

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
